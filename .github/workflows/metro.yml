name: Metro Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject signing + CI memory props
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/key.jks
          {
            echo "RELEASE_STORE_FILE=./key.jks"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
            echo "org.gradle.jvmargs=-XX:+UseParallelGC -Xmx5g -Xms512m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.workers.max=2"
          } >> gradle.properties

      - name: Build release APK
        run: ./gradlew :app:assembleAppRelease --stacktrace --warning-mode all

      - name: Collect APK
        run: |
          mkdir -p out
          APK="$(find app/build/outputs/apk/app/release -name "*.apk" | head -n 1)"
          echo "Found APK: $APK"
          cp "$APK" out/legado-metro-v0.1.0.apk
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-metro
          path: out/legado-metro-v0.1.0.apk
          if-no-files-found: error
