name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            nodejs \
            npm \
            default-jdk \
            openjdk-17-jdk

      - name: Install Node.js dependencies
        run: npm install

      - name: Setup Android SDK
        run: |
          if [ -d "$ANDROID_HOME" ]; then
            echo "Using pre-installed Android SDK: $ANDROID_HOME"
          elif [ -d "/usr/lib/android-sdk" ]; then
            echo "Using system Android SDK"
            ls /usr/lib/android-sdk
          fi

      - name: Build Tauri app
        run: npm run tauri build

      - name: Find APK files
        run: find src-tauri/target -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-apk
          path: src-tauri/target/release/bundle/apk/**/*.apk
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-apk-debug
          path: src-tauri/target/debug/bundle/apk/**/*.apk
          retention-days: 7
