name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & sign APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Setup Android SDK (accept licenses)
        uses: android-actions/setup-android@v4

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project (gen/android)
        # gen/android is gitignored, so it must be generated on every run.
        # The Tauri CLI itself installs the required NDK + platform packages
        # through sdkmanager when missing.
        run: npx tauri android init --ci --skip-targets-install

      - name: Restore signing keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.keystore/release.keystore"
            ls -l "$HOME/.keystore"
          else
            echo "No KEYSTORE_BASE64 secret configured; building unsigned APK"
          fi

      - name: Build APK (arm64-v8a + armeabi-v7a)
        run: npx tauri android build --ci --apk -t aarch64 -t armv7

      - name: Sign APK with release keystore
        run: |
          if [ ! -f "$HOME/.keystore/release.keystore" ]; then
            echo "No keystore found; skipping signing (unsigned APK)"
            exit 0
          fi
          set -euo pipefail
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"
          find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' -type f | while read -r apk; do
            signed="${apk%-unsigned.apk}.apk"
            "$APKSIGNER" sign \
              --ks "$HOME/.keystore/release.keystore" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$signed" "$apk"
            rm -f "$apk"
            echo "Signed: $signed"
          done
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | sort

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: novel-reader-apk
          path: apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/**/*.apk
          generate_release_notes: true
