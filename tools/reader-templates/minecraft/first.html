<article class="mc-page mc-overworld">
  <div class="mc-world-edge" aria-hidden="true"></div>
  <header class="mc-sky">
    <div class="mc-stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="mc-celestial-track" aria-hidden="true"><div class="mc-sun"></div><div class="mc-moon"></div></div>
    <div class="mc-mountains mc-mountains-far" aria-hidden="true"></div><div class="mc-mountains mc-mountains-near" aria-hidden="true"></div>
    <div class="mc-cloud mc-cloud-one" aria-hidden="true"></div>
    <div class="mc-cloud mc-cloud-two" aria-hidden="true"></div>
    <div class="mc-world-name" aria-hidden="true"><span class="mc-edition">A READER'S ADVENTURE</span><strong>MINECRAFT</strong><span class="mc-world-caption">主世界 · 方块漫游</span></div>
    <div class="mc-landscape" aria-hidden="true">{{landscape}}</div>
    <div class="mc-meadow" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="mc-hero-walkway" aria-hidden="true"><div class="mc-walker">{{creeper}}</div></div>
    <div class="mc-motes" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="mc-book-sign"><i class="mc-item mc-item-book" aria-hidden="true"></i><span data-reader-field="bookName"></span></div>
    <span class="mc-biome" aria-hidden="true"><i class="mc-day-symbol"></i><span class="mc-day-label"></span> · OVERWORLD</span>
  </header>
  <main class="mc-paper">
    <div class="mc-paper-corner mc-paper-nw" aria-hidden="true"></div><div class="mc-paper-corner mc-paper-se" aria-hidden="true"></div>
    <span class="mc-paper-tab" aria-hidden="true"><i class="mc-item mc-item-map"></i>冒险手记</span>
    <section class="mc-body" data-reader-flow="body" data-reader-flow-pagination="columns"></section>
  </main>
  {{footer}}
</article>
