<article class="mc-page mc-cave">
  <div class="mc-rockwork" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <header class="mc-underground">
    <div class="mc-tool-slot" aria-hidden="true"><i class="mc-item mc-item-pickaxe"></i></div>
    <div class="mc-cave-heading"><span class="mc-depth" aria-hidden="true">DEEP UNDERGROUND</span><span class="mc-running-title" data-reader-field="chapterTitle"></span></div>
    <div class="mc-cave-diorama" aria-hidden="true"><span class="mc-cave-crystal"></span><div class="mc-walker">{{skeleton}}</div><span class="mc-cave-ground"></span><span class="mc-cave-lantern"></span><span class="mc-target"><i class="mc-target-flash"></i></span><div class="mc-arrow-range"><i class="mc-arrow"><i></i></i></div></div>
  </header>
  <main class="mc-paper">
    <div class="mc-paper-corner mc-paper-nw" aria-hidden="true"></div><div class="mc-paper-corner mc-paper-se" aria-hidden="true"></div>
    <span class="mc-paper-tab" aria-hidden="true"><i class="mc-item mc-item-diamond"></i>矿洞拾光</span>
    <section class="mc-body" data-reader-flow="body" data-reader-flow-pagination="columns"></section>
  </main>
  <div class="mc-torch mc-torch-left" aria-hidden="true"><i class="mc-torch-glow"></i><i class="mc-torch-wood"></i><span class="mc-flame"><i></i></span></div>
  <div class="mc-torch mc-torch-right" aria-hidden="true"><i class="mc-torch-glow"></i><i class="mc-torch-wood"></i><span class="mc-flame"><i></i></span></div>
  <div class="mc-cave-sparks" aria-hidden="true"><i></i><i></i><i></i></div>
  {{footer}}
</article>
