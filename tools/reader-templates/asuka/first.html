<article class="as-page as-opening">
  <div class="as-page-grain" aria-hidden="true"></div>
  <header class="as-hero" data-reader-text-ignore>
    <div class="as-hero-rules" aria-hidden="true"></div>
    <div class="as-portrait" aria-hidden="true"><i class="as-portrait-image"></i><i class="as-scan"></i></div>
    <div class="as-hero-copy"><span class="as-kicker">SECOND CHILDREN / READING ARCHIVE</span><strong class="as-unit">02<span>EVA</span></strong><span class="as-name">ASUKA<br>LANGLEY</span><span class="as-name-cn">明日香 <i>赤色同步</i></span></div>
    <div class="as-orbit" aria-hidden="true">{{orbit}}</div>
    <div class="as-hero-caption"><span class="as-live-dot" aria-hidden="true"></span><span>THE WORLD IS YOURS.</span><b>UNIT—02</b></div>
  </header>
  <div class="as-bookline" data-reader-text-ignore><span class="as-index-mark">A / 02</span><span data-reader-field="bookName"></span><i aria-hidden="true">{{emblem}}</i></div>
  <main class="as-paper"><div class="as-paper-corners" aria-hidden="true"></div><section class="as-flow" data-reader-flow="body" data-reader-order="1" data-reader-flow-pagination="columns"></section></main>
  {{footer}}
</article>
