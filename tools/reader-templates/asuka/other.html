<article class="as-page as-cockpit">
  <div class="as-page-grain" aria-hidden="true"></div>
  <header class="as-console" data-reader-text-ignore>
    <div class="as-console-art" aria-hidden="true"></div><i class="as-scan" aria-hidden="true"></i>
    <div class="as-console-badge"><b>02</b><span>EVA / ARCHIVE</span></div>
    <div class="as-console-copy"><span class="as-kicker">ASUKA LANGLEY / FIELD NOTES</span><strong data-reader-field="bookName"></strong><span class="as-console-chapter" data-reader-field="chapterTitle"></span></div>
    <div class="as-console-orbit" aria-hidden="true">{{orbit}}</div>
  </header>
  <div class="as-bookline" data-reader-text-ignore><span class="as-index-mark">READING LOG</span><span class="as-channel"><i class="as-live-dot" aria-hidden="true"></i>赤色同步 / ENTRY PLUG</span><i aria-hidden="true">{{emblem}}</i></div>
  <main class="as-paper"><div class="as-paper-corners" aria-hidden="true"></div><section class="as-flow" data-reader-flow="body" data-reader-order="1" data-reader-flow-pagination="columns"></section></main>
  {{footer}}
</article>
